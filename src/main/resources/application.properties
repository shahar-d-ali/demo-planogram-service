spring.application.name=demo-planogram-service

server.servlet.context-path=/api/planogram

server.port=8002

spring.datasource.url=jdbc:mysql://localhost:3306/demo_planogram_db?&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Kafka + Schema Registry Configuration
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081

spring.kafka.consumer.group-id=planogram-service-group
spring.kafka.consumer.enable-auto-commit=false
# spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.listener.ack-mode=MANUAL

# Swagger / OpenAPI 3.0 Documentation Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# Kafka Streams Configuration (Fraud Detection)
spring.kafka.streams.application-id=demo-planogram-fraud-detection-streams
spring.kafka.streams.bootstrap-servers=localhost:9092
spring.kafka.streams.auto-startup=true
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
spring.kafka.streams.properties.schema.registry.url=http://localhost:8081
spring.kafka.streams.properties.specific.avro.reader=true
spring.kafka.streams.properties.commit.interval.ms=1000
spring.kafka.streams.properties.auto.offset.reset=earliest
spring.kafka.streams.properties.default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler


# Topic Names
kafka.topic.ping=demo-ping-topic
kafka.topic.transaction=transaction-events
kafka.topic.fraud-detection=fraud-detection-topic

# Fraud Detection Configuration
kafka.fraud.amount-threshold=1000.0

# Detailed Logging for Fraud Detection Stream & Kafka Consumers
logging.level.com.demo.planogramservice.events=DEBUG
logging.level.org.apache.kafka.streams=INFO
logging.level.org.springframework.kafka.config.StreamsBuilderFactoryBean=DEBUG

